      - name: Install dependencies
        run: |
          pip install requests pandas pyarrow duckdb dbt-duckdb great-expectations

      - name: Run ingestion
        run: python3 ingestion/fetch_contracts.py

      - name: Run dbt
        working-directory: dbt_project
        run: |
          dbt run --profiles-dir .
          dbt test --profiles-dir .
